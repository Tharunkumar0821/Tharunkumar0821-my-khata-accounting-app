name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Find Flutter project
        id: project
        shell: bash
        run: |
          PROJECT_DIR=$(dirname "$(find . -name pubspec.yaml -print -quit)")
          echo "Flutter project: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Generate Android project
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          flutter create \
            --platforms=android \
            --no-pub \
            .

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configure Android SDK 35
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          s = p.read_text()

          s = s.replace(
              "compileSdk = flutter.compileSdkVersion",
              "compileSdk = 35"
          )

          s = s.replace(
              "compileSdk flutter.compileSdkVersion",
              "compileSdk 35"
          )

          p.write_text(s)

          print("Android compileSdk configured to 35")
          PY

      - name: Install dependencies
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          flutter pub get

      - name: Build APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-khata-release-apk
          path: ${{ steps.project.outputs.project_dir }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
